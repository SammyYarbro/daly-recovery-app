<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daly Recovery — Dashboard</title>
  <meta name="theme-color" content="#161826">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/css/nocturne.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="dash-auth" class="auth-screen">
    <h1>Daly Recovery</h1>
    <p class="subtitle">Manager sign-in</p>
    <div class="auth-form">
      <div id="dash-auth-phone">
        <input type="tel" id="dash-phone" class="input" placeholder="(415) 000-0000" autocomplete="tel">
        <div style="height:var(--space-3)"></div>
        <button id="dash-send-code" class="btn btn-primary w-full" style="min-height:48px">Send sign-in code</button>
        <div id="dash-recaptcha" style="display:flex;justify-content:center;margin-top:var(--space-4)"></div>
      </div>
      <div id="dash-auth-code" class="hidden">
        <p class="text-muted" style="font-size:13px;margin-bottom:var(--space-3)">Code sent to <span id="dash-phone-display"></span></p>
        <input type="text" id="dash-code" class="input" placeholder="6-digit code" maxlength="6" inputmode="numeric">
        <div style="height:var(--space-3)"></div>
        <button id="dash-verify" class="btn btn-primary w-full" style="min-height:48px">Verify</button>
      </div>
      <div id="dash-auth-error" class="hidden" style="color:#fca5a5;font-size:13px;margin-top:var(--space-2)"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <div class="dash-layout">
      <!-- Sidebar (desktop) -->
      <div class="dash-sidebar">
        <div style="font-family:var(--font-heading);font-size:18px;font-weight:700;margin-bottom:var(--space-6)">Daly Recovery</div>
        <div class="flex flex-col gap-1">
          <div class="dash-nav-item active" data-section="board">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M104 40H56a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16V56a16 16 0 00-16-16zm96 0h-48a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16V56a16 16 0 00-16-16zm-96 96H56a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16v-48a16 16 0 00-16-16zm96 0h-48a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16v-48a16 16 0 00-16-16z"/></svg>
            Board
          </div>
          <div class="dash-nav-item" data-section="apps">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M213.7 82.3l-56-56A8 8 0 00152 24H56a16 16 0 00-16 16v176a16 16 0 0016 16h144a16 16 0 0016-16V88a8 8 0 00-2.3-5.7z"/></svg>
            Applications <span id="nav-app-count" class="tag tag-accent" style="margin-left:auto;font-size:10px"></span>
          </div>
          <div class="dash-nav-item" data-section="messages">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M216 48H40a16 16 0 00-16 16v160a8 8 0 0013 6.2L72 192h144a16 16 0 0016-16V64a16 16 0 00-16-16z"/></svg>
            Messages
          </div>
          <div class="dash-nav-item" data-section="money">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128 24a104 104 0 100 208 104 104 0 000-208zm12 152h-4v8a8 8 0 01-16 0v-8h-12a8 8 0 010-16h36a12 12 0 000-24h-32a28 28 0 010-56h4v-8a8 8 0 0116 0v8h12a8 8 0 010 16H108a12 12 0 000 24h32a28 28 0 010 56z"/></svg>
            Rent Ledger
          </div>
          <div class="dash-nav-item" data-section="records">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M216 40H40a16 16 0 00-16 16v144a16 16 0 0016 16h176a16 16 0 0016-16V56a16 16 0 00-16-16zM96 136h64a8 8 0 010 16H96a8 8 0 010-16zm0-32h64a8 8 0 010 16H96a8 8 0 010-16zm0 64h64a8 8 0 010 16H96a8 8 0 010-16z"/></svg>
            Records
          </div>
          <div class="dash-nav-item" data-section="residents">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M164.5 132.7a52 52 0 10-73 0 79.9 79.9 0 00-32.3 22.5 8 8 0 0012.1 10.5 64 64 0 0197.4 0 8 8 0 0012.1-10.5z"/></svg>
            Manage Residents
          </div>
          <div class="dash-nav-item" data-section="settings">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128 80a48 48 0 100 96 48 48 0 000-96zm0 80a32 32 0 110-64 32 32 0 010 64z"/></svg>
            House Settings
          </div>
        </div>
        <div style="margin-top:auto;padding-top:var(--space-6)">
          <button class="btn btn-ghost w-full" id="dash-signout" style="font-size:12px">Sign out</button>
        </div>
      </div>

      <!-- Mobile nav -->
      <div class="bottom-nav" style="display:none" id="mobile-nav">
        <div class="nav-item active" data-section="board"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M104 40H56a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16V56a16 16 0 00-16-16zm96 0h-48a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16V56a16 16 0 00-16-16zm-96 96H56a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16v-48a16 16 0 00-16-16zm96 0h-48a16 16 0 00-16 16v48a16 16 0 0016 16h48a16 16 0 0016-16v-48a16 16 0 00-16-16z"/></svg><span>Board</span></div>
        <div class="nav-item" data-section="apps"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M213.7 82.3l-56-56A8 8 0 00152 24H56a16 16 0 00-16 16v176a16 16 0 0016 16h144a16 16 0 0016-16V88a8 8 0 00-2.3-5.7z"/></svg><span>Intake</span></div>
        <div class="nav-item" data-section="messages"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M216 48H40a16 16 0 00-16 16v160a8 8 0 0013 6.2L72 192h144a16 16 0 0016-16V64a16 16 0 00-16-16z"/></svg><span>Chat</span></div>
        <div class="nav-item" data-section="money"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M128 24a104 104 0 100 208 104 104 0 000-208zm12 152h-4v8a8 8 0 01-16 0v-8h-12a8 8 0 010-16h36a12 12 0 000-24h-32a28 28 0 010-56h4v-8a8 8 0 0116 0v8h12a8 8 0 010 16H108a12 12 0 000 24h32a28 28 0 010 56z"/></svg><span>Rent</span></div>
        <div class="nav-item" data-section="records"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M216 40H40a16 16 0 00-16 16v144a16 16 0 0016 16h176a16 16 0 0016-16V56a16 16 0 00-16-16z"/></svg><span>More</span></div>
      </div>

      <!-- Main Content -->
      <div class="dash-main">
        <div id="dash-content"></div>
      </div>
    </div>
  </div>

  <!-- Sheet Overlay -->
  <div class="sheet-overlay" id="dash-sheet-overlay">
    <div class="sheet" id="dash-sheet" style="max-width:500px;margin:0 auto">
      <div class="flex items-center justify-between" style="margin-bottom:var(--space-4)">
        <h3 style="font-size:18px;font-weight:600" id="dash-sheet-title"></h3>
        <button class="btn btn-ghost" id="dash-sheet-close" style="padding:var(--space-2)">&times;</button>
      </div>
      <p class="text-muted" style="font-size:13px;margin-bottom:var(--space-4)" id="dash-sheet-body"></p>
      <div id="dash-sheet-content"></div>
      <button class="btn btn-primary w-full" id="dash-sheet-cta" style="min-height:48px;margin-top:var(--space-4)"></button>
    </div>
  </div>

  <div class="toast" id="dash-toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
